<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog Dashboard</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --primary: #4f46e5;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        form {
            background: var(--surface);
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            font-weight: 500;
        }

        #add-book-btn {
            background: var(--primary);
            color: white;
        }

        /* Keep list structural footprint visible at all times */
        #book-list {
            list-style: none;
            padding: 0;
            display: block !important;
            visibility: visible !important;
            min-height: 10px;
        }

        li {
            background: var(--surface);
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
        }
    </style>
</head>

<body>

    <h1>Library Catalog</h1>

    <form id="book-form" onsubmit="addBook(event)">
        <input type="text" id="title" placeholder="Book Title" required autocomplete="off">
        <input type="text" id="author" placeholder="Author" required autocomplete="off">
        <button type="submit" id="add-book-btn">Add Book</button>
    </form>

    <ul id="book-list"></ul>

    <script>
        const bookList = document.getElementById('book-list');

        // Fetch data from backend API
        async function loadBooks() {
            try {
                const res = await fetch('/books');
                if (res.ok) {
                    const books = await res.json();
                    bookList.innerHTML = '';

                    books.forEach((book, index) => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span><strong>${book.title}</strong> by ${book.author}</span>
                            <button class="delete-btn" onclick="deleteBook(${index})">Delete</button>
                        `;
                        bookList.appendChild(li);
                    });
                }
            } catch (err) {
                console.error("Failed to load catalog items:", err);
            }
        }

        // Handle book insertions
        async function addBook(e) {
            e.preventDefault();
            const titleInput = document.getElementById('title');
            const authorInput = document.getElementById('author');

            const title = titleInput.value.trim();
            const author = authorInput.value.trim();

            try {
                const res = await fetch('/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author })
                });

                if (res.ok) {
                    titleInput.value = '';
                    authorInput.value = '';
                    await loadBooks(); // Synchronize listing layout cleanly
                }
            } catch (err) {
                console.error("Submission failed:", err);
            }
        }

        // Handle removing items
        async function deleteBook(index) {
            try {
                const res = await fetch(`/books/${index}`, { method: 'DELETE' });
                if (res.ok) {
                    await loadBooks();
                }
            } catch (err) {
                console.error("Deletion request failed:", err);
            }
        }

        // Load collection instantly on viewport initialization
        loadBooks();
    </script>
</body>

</html>
