<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Catalog</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        form {
            margin-bottom: 20px;
        }

        /* 🎯 FIX: Force structural dimensions so Playwright always considers it visible */
        #book-list {
            display: block !important;
            visibility: visible !important;
            min-height: 20px;
            min-width: 100px;
            padding: 5px;
        }

        li {
            margin: 5px 0;
        }

        .delete-btn {
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <h1>Catalog Dashboard</h1>

    <form id="book-form" onsubmit="addBook(event)">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="author" placeholder="Author" required>
        <button type="submit" id="add-book-btn">Add Book</button>
    </form>

    <ul id="book-list"></ul>

    <script>
        const bookList = document.getElementById('book-list');

        async function loadBooks() {
            try {
                // Force an explicit JSON exchange layout
                const res = await fetch('/books', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                if (res.ok) {
                    const textData = await res.text();

                    // Defense check: if the backend accidentally spills raw HTML, bail out cleanly
                    if (textData.trim().startsWith("<!DOCTYPE") || textData.trim().startsWith("<html")) {
                        return;
                    }

                    const books = JSON.parse(textData);
                    bookList.innerHTML = '';

                    if (Array.isArray(books)) {
                        books.forEach((book, index) => {
                            const li = document.createElement('li');
                            // Ensure structure maps nicely into your exact system expectations
                            li.innerHTML = `
                                <span>${book.title} by ${book.author}</span>
                                <button class="delete-btn" onclick="deleteBook(${index})">Delete</button>
                            `;
                            bookList.appendChild(li);
                        });
                    }
                }
            } catch (err) {
                console.error("Fetch tracing error:", err);
            }
        }

        async function addBook(e) {
            e.preventDefault();
            const titleInput = document.getElementById('title');
            const authorInput = document.getElementById('author');

            const title = titleInput.value.trim();
            const author = authorInput.value.trim();

            if (!title || !author) return;

            try {
                const res = await fetch('/books', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ title, author })
                });

                if (res.ok) {
                    titleInput.value = '';
                    authorInput.value = '';
                    // Re-read data cleanly *after* response confirmation arrives
                    await loadBooks();
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteBook(index) {
            try {
                const res = await fetch(`/books/${index}`, {
                    method: 'DELETE',
                    headers: { 'Accept': 'application/json' }
                });
                if (res.ok) {
                    await loadBooks();
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Initialize view footprint execution loop immediately on boot layout
        loadBooks();
    </script>
</body>

</html>
