<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LetterBookxd Catalog</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            max-width: 600px;
        }

        form {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Book Catalog Dashboard</h1>

    <form id="book-form" onsubmit="addBook(event)">
        <input type="text" id="title" placeholder="Book Title" required>
        <input type="text" id="author" placeholder="Author Name" required>
        <button type="submit" id="add-book-btn">Add Book</button>
    </form>

    <ul id="book-list"></ul>

    <script>
        const bookList = document.getElementById('book-list');

        // Render standard catalog lists
        function renderBooks(books) {
            bookList.innerHTML = '';

            if (!books || books.length === 0) {
                bookList.innerHTML = '<div class="empty-state">No books currently logged in this catalog.</div>';
                return;
            }

            books.forEach((book, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>${book.title}</strong> by ${book.author}</span>
                    <button class="delete-btn" onclick="deleteBook(${index})">Delete</button>
                `;
                bookList.appendChild(li);
            });
        }

        // Fetch updates from backend catalog
        async function loadBooks() {
            try {
                // Explicitly send Accept headers to prevent Flask routing collisions
                const res = await fetch('/books', {
                    headers: { 'Accept': 'application/json' }
                });
                if (res.ok) {
                    const books = await res.json();
                    renderBooks(books);
                }
            } catch (err) {
                console.error("Error loading book metrics:", err);
            }
        }

        // Handle Form Submission (POST)
        async function addBook(e) {
            e.preventDefault();

            const titleInput = document.getElementById('title');
            const authorInput = document.getElementById('author');
            const title = titleInput.value.trim();
            const author = authorInput.value.trim();

            if (!title || !author) return;

            try {
                const res = await fetch('/books', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ title, author })
                });

                if (res.ok) {
                    titleInput.value = '';
                    authorInput.value = '';
                    // Force complete sequential data synchronization
                    await loadBooks();
                }
            } catch (err) {
                console.error("Error creating entry document:", err);
            }
        }

        // Handle Book Deletion (DELETE)
        async function deleteBook(index) {
            try {
                const res = await fetch(`/books/${index}`, {
                    method: 'DELETE',
                    headers: { 'Accept': 'application/json' }
                });
                if (res.ok) {
                    await loadBooks();
                }
            } catch (err) {
                console.error("Error deleting entry instance:", err);
            }
        }

        // Initialize lookup check immediately on execution stream lifecycle entry
        loadBooks();
    </script>
</body>

</html>
